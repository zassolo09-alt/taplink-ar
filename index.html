<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR ROAD LINE</title>
  <meta name="description" content="AR ROAD LINE — Logistics Company">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 40px;
      letter-spacing: -0.01em;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Profile Section */
    .profile {
      text-align: center;
      margin-bottom: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 1px solid #262626;
      background: #0A0A0A;
      object-fit: cover;
      margin-bottom: 18px;
      display: block;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #FFFFFF;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #737373;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    /* Links List */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 14px 18px;
      background: #0A0A0A;
      border: 1px solid #1C1C1C;
      border-radius: 14px;
      text-decoration: none;
      color: #FFFFFF;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    .link-item:hover, .link-item:active {
      background: #141414;
      border-color: #333333;
      transform: translateY(-1px);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .link-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #121212;
      border: 1px solid #222222;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      flex-shrink: 0;
    }

    .link-text {
      text-align: left;
    }

    .link-name {
      font-size: 14px;
      font-weight: 600;
      color: #FFFFFF;
    }

    .link-sub {
      font-size: 12px;
      color: #737373;
      margin-top: 2px;
    }

    .link-arrow {
      color: #404040;
      flex-shrink: 0;
      transition: color 0.15s ease, transform 0.15s ease;
    }

    .link-item:hover .link-arrow {
      color: #FFFFFF;
      transform: translateX(2px);
    }

    /* Action Buttons Row */
    .actions-row {
      width: 100%;
      display: flex;
      gap: 10px;
      margin-bottom: 36px;
    }

    .btn-action {
      flex: 1;
      padding: 12px;
      background: #0A0A0A;
      border: 1px solid #1C1C1C;
      border-radius: 12px;
      color: #A3A3A3;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      text-decoration: none;
    }

    .btn-action:hover {
      background: #141414;
      border-color: #333333;
      color: #FFFFFF;
    }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 11px;
      color: #404040;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: auto;
    }

    /* Minimalist QR Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      width: 100%;
      max-width: 360px;
      background: #0A0A0A;
      border: 1px solid #262626;
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      transform: scale(0.96);
      transition: transform 0.2s ease;
    }

    .modal-overlay.active .modal-box {
      transform: scale(1);
    }

    .modal-title {
      font-size: 15px;
      font-weight: 600;
      color: #FFFFFF;
      letter-spacing: 0.04em;
    }

    .modal-tabs {
      display: flex;
      background: #141414;
      border: 1px solid #222222;
      border-radius: 10px;
      padding: 3px;
      margin: 16px 0;
      gap: 3px;
    }

    .modal-tab {
      flex: 1;
      padding: 7px 0;
      border: none;
      background: transparent;
      color: #737373;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      border-radius: 7px;
      cursor: pointer;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .modal-tab.active {
      background: #262626;
      color: #FFFFFF;
    }

    .qr-frame {
      background: #FFFFFF;
      padding: 14px;
      border-radius: 14px;
      display: inline-block;
      margin-bottom: 16px;
    }

    .qr-frame img {
      display: block;
      width: 190px;
      height: 190px;
    }

    .qr-url {
      font-size: 11px;
      color: #737373;
      margin-bottom: 18px;
      word-break: break-all;
    }

    .modal-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-download-white {
      width: 100%;
      padding: 11px;
      background: #FFFFFF;
      color: #000000;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .btn-download-white:hover {
      opacity: 0.9;
    }

    .btn-close {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px solid #262626;
      color: #A3A3A3;
      border-radius: 10px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .btn-close:hover {
      color: #FFFFFF;
      border-color: #404040;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      background: #171717;
      color: #FFFFFF;
      border: 1px solid #2E2E2E;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 12px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      pointer-events: none;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Profile -->
    <header class="profile">
      <img src="logo.png" alt="AR ROAD LINE" class="avatar">
      <h1 class="title">AR ROAD LINE</h1>

    </header>

    <!-- Monochrome Minimal Links -->
    <main class="links">
      <!-- Telegram Channel -->
      <a href="https://t.me/Ar_road_line" target="_blank" rel="noopener noreferrer" class="link-item">
        <div class="link-left">
          <div class="link-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </div>
          <div class="link-text">
            <div class="link-name">Telegram Kanal</div>
            <div class="link-sub">@Ar_road_line</div>

        </div>
        <div class="link-arrow">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </a>

      <!-- Telegram Profile -->
      <a href="https://t.me/Ar_road_line" target="_blank" rel="noopener noreferrer" class="link-item">
        <div class="link-left">
          <div class="link-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
          </div>
          <div class="link-text">
            <div class="link-name">Telegram Aloqa</div>
            <div class="link-sub">@Ar_road_line</div>
          </div>
        </div>
        <div class="link-arrow">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </a>

      <!-- Instagram Profile -->
      <a href="https://www.instagram.com/ar_road_line" target="_blank" rel="noopener noreferrer" class="link-item">
        <div class="link-left">
          <div class="link-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
          </div>
          <div class="link-text">
            <div class="link-name">Instagram</div>
            <div class="link-sub">@ar_road_line</div>
          </div>
        </div>
        <div class="link-arrow">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </a>

      <!-- Phone Call -->
      <a href="tel:+998888321661" class="link-item">
        <div class="link-left">
          <div class="link-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
          </div>
          <div class="link-text">
            <div class="link-name">Telefon</div>
            <div class="link-sub">+998 88 832 16 61</div>
          </div>
        </div>
        <div class="link-arrow">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </a>

      <!-- Location -->
      <a href="https://maps.google.com/?q=Bobur+shoh+ko'chasi+73A+Andijon" target="_blank" rel="noopener noreferrer" class="link-item">
        <div class="link-left">
          <div class="link-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
          </div>
          <div class="link-text">
            <div class="link-name">Manzil</div>
            <div class="link-sub">Andijon, Bobur shoh ko'chasi, 73A</div>
          </div>
        </div>
        <div class="link-arrow">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </a>
    </main>

    <!-- Minimal Action Buttons -->
    <div class="actions-row">
      <button class="btn-action" onclick="openQrModal('telegram')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>QR Kod</span>
      </button>

      <button class="btn-action" onclick="downloadVCard()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        <span>Kontaktni saqlash</span>
      </button>

      <button class="btn-action" onclick="copyLink()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <span>Ulashish</span>
      </button>
    </div>

    <!-- Minimal Footer -->
    <footer class="footer">
      AR ROAD LINE &bull; 2026
    </footer>
  </div>

  <!-- QR Modal -->
  <div class="modal-overlay" id="qrModal" onclick="handleOverlayClick(event)">
    <div class="modal-box">
      <h3 class="modal-title">QR KOD</h3>

      <div class="modal-tabs">
        <button class="modal-tab active" id="tabTg" onclick="switchTab('telegram')">Telegram</button>
        <button class="modal-tab" id="tabIg" onclick="switchTab('instagram')">Instagram</button>
      </div>

      <div class="qr-frame">
        <img id="qrImg" src="qr_telegram.png" alt="QR Code">
      </div>

      <div class="qr-url" id="qrUrl">https://t.me/Ar_road_line</div>

      <div class="modal-buttons">
        <a id="btnDownload" href="qr_telegram.png" download="ar_road_line_telegram.png" class="btn-download-white">
          PNG yuklab olish
        </a>
        <button class="btn-close" onclick="closeQrModal()">Yopish</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Havola nusxalandi</div>

  <script>
    const qrConfig = {
      telegram: {
        url: 'https://t.me/Ar_road_line',
        png: 'qr_telegram.png'
      },
      instagram: {
        url: 'https://www.instagram.com/ar_road_line',
        png: 'qr_instagram.png'
      }
    };

    function openQrModal(type = 'telegram') {
      switchTab(type);
      document.getElementById('qrModal').classList.add('active');
    }

    function closeQrModal() {
      document.getElementById('qrModal').classList.remove('active');
    }

    function handleOverlayClick(e) {
      if (e.target.id === 'qrModal') closeQrModal();
    }

    function switchTab(type) {
      document.getElementById('tabTg').classList.toggle('active', type === 'telegram');
      document.getElementById('tabIg').classList.toggle('active', type === 'instagram');
      const data = qrConfig[type];
      document.getElementById('qrImg').src = data.png;
      document.getElementById('qrUrl').textContent = data.url;
      const downloadBtn = document.getElementById('btnDownload');
      downloadBtn.href = data.png;
      downloadBtn.download = `ar_road_line_${type}.png`;
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function copyLink() {
      if (navigator.share) {
        navigator.share({
          title: 'AR ROAD LINE',
          url: window.location.href
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href).then(() => {
          showToast('Havola nusxalandi');
        });
      }
    }

    function downloadVCard() {
      const vcard = 
`BEGIN:VCARD
VERSION:3.0
FN:AR ROAD LINE
ORG:AR ROAD LINE
TEL;TYPE=CELL,VOICE:+998888321661
ADR;TYPE=WORK:;;Bobur shoh ko'chasi 73A;Andijon;;;Uzbekistan
URL:https://t.me/Ar_road_line
END:VCARD`;
      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', 'AR_ROAD_LINE.vcf');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('Kontakt yuklab olindi');
    }
  </script>
</body>
